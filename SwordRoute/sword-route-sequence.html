<div id="sword-route-sequence">
  <h2>검 궤적 생성 순서</h2>
  <div class="viz-controls">
    <label class="form-label">바라보는 방향
      <select id="srs-face" class="form-select">
        <option value="0,-1">위 (0, -1) · 직선</option>
        <option value="1,0">오른쪽 (1, 0) · 직선</option>
        <option value="0,1">아래 (0, 1) · 직선</option>
        <option value="-1,0">왼쪽 (-1, 0) · 직선</option>
        <option value="1,-1">오른쪽 위 (1, -1) · 대각선</option>
        <option value="1,1">오른쪽 아래 (1, 1) · 대각선</option>
        <option value="-1,1">왼쪽 아래 (-1, 1) · 대각선</option>
        <option value="-1,-1">왼쪽 위 (-1, -1) · 대각선</option>
      </select>
    </label>
    <label class="form-label">코드 순서
      <input id="srs-step" class="form-range" type="range" min="1" max="7" value="1">
      <span id="srs-step-label" class="tabular-nums">1 / 7</span>
    </label>
  </div>

  <div class="srs-status viz-row" aria-live="polite">
    <span><strong id="srs-branch"></strong></span>
    <span>현재 궤적: <strong id="srs-sequence"></strong></span>
  </div>

  <svg id="srs-svg" role="img" aria-labelledby="srs-title srs-desc">
    <title id="srs-title">플레이어 기준 검 궤적 좌표</title>
    <desc id="srs-desc">선택한 바라보는 방향과 코드 순서에 따라 근거리, 중거리, 원거리 좌표를 격자에 표시합니다.</desc>
  </svg>

  <div class="srs-legend viz-row" aria-label="범례">
    <span><i class="srs-dot srs-player"></i>플레이어</span>
    <span><i class="srs-dot srs-near"></i>Near</span>
    <span><i class="srs-dot srs-middle"></i>Middle</span>
    <span><i class="srs-dot srs-far"></i>Far</span>
  </div>
</div>

<style>
  #sword-route-sequence { width: 100%; color: var(--foreground); }
  #sword-route-sequence h2 { margin-bottom: 12px; }
  #sword-route-sequence .viz-controls { align-items: end; }
  #sword-route-sequence .form-label { min-width: 210px; flex: 1; }
  #sword-route-sequence .form-range { display: block; width: 100%; }
  #sword-route-sequence .srs-status { justify-content: space-between; margin: 12px 0 8px; }
  #sword-route-sequence svg { display: block; width: 100%; min-height: 430px; }
  #sword-route-sequence .srs-grid { stroke: var(--border); stroke-width: 1; }
  #sword-route-sequence .srs-axis { stroke: var(--muted-foreground); stroke-width: 1.5; }
  #sword-route-sequence .srs-path { fill: none; stroke: var(--muted-foreground); stroke-width: 2; }
  #sword-route-sequence .srs-facing { stroke: var(--foreground); stroke-width: 2.5; }
  #sword-route-sequence .srs-label { fill: var(--foreground); font-size: 12px; font-weight: 500; text-anchor: middle; dominant-baseline: middle; }
  #sword-route-sequence .srs-coord { fill: var(--muted-foreground); font-size: 11px; text-anchor: middle; }
  #sword-route-sequence .srs-mark-player { fill: var(--foreground); }
  #sword-route-sequence .srs-mark-near { fill: var(--viz-series-1); }
  #sword-route-sequence .srs-mark-middle { fill: var(--viz-series-2); }
  #sword-route-sequence .srs-mark-far { fill: var(--viz-series-3); }
  #sword-route-sequence .srs-ring { stroke-width: 3; }
  #sword-route-sequence .srs-legend { justify-content: center; margin-top: 8px; }
  #sword-route-sequence .srs-legend span { display: inline-flex; align-items: center; gap: 6px; }
  #sword-route-sequence .srs-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  #sword-route-sequence .srs-player { background: var(--foreground); }
  #sword-route-sequence .srs-near { background: var(--viz-series-1); }
  #sword-route-sequence .srs-middle { background: var(--viz-series-2); }
  #sword-route-sequence .srs-far { background: var(--viz-series-3); }
  @media (max-width: 480px) {
    #sword-route-sequence svg { min-height: 360px; }
    #sword-route-sequence .srs-status { align-items: flex-start; }
  }
</style>

<script>
(() => {
  const root = document.getElementById('sword-route-sequence');
  const faceSelect = root.querySelector('#srs-face');
  const stepInput = root.querySelector('#srs-step');
  const stepLabel = root.querySelector('#srs-step-label');
  const branchLabel = root.querySelector('#srs-branch');
  const sequenceLabel = root.querySelector('#srs-sequence');
  const svg = root.querySelector('#srs-svg');
  const NS = 'http://www.w3.org/2000/svg';

  const matrices = {
    n90: [0, 1, -1, 0],
    n45: [1, 1, -1, 1],
    p45: [1, -1, 1, 1],
    p90: [0, -1, 1, 0]
  };

  const add = (...vs) => vs.reduce((a, v) => [a[0] + v[0], a[1] + v[1]], [0, 0]);
  const cal = (face, m) => {
    let x = face[0] * m[0] + face[1] * m[2];
    let y = face[0] * m[1] + face[1] * m[3];
    if (face[0] * face[1] !== 0 && m[0] === 1) { x /= 2; y /= 2; }
    return [x, y];
  };

  function routeFor(face, step) {
    const n90 = cal(face, matrices.n90);
    const n45 = cal(face, matrices.n45);
    const p45 = cal(face, matrices.p45);
    const p90 = cal(face, matrices.p90);
    const cardinal = face[0] * face[1] === 0;
    const rows = cardinal ? [
      [n90, add(n90,n90), add(n90,n90,n90), '-90 → -90 → -90'],
      [n90, add(n90,n45), add(n90,n90,n45), '-90 → -45 → -45'],
      [n45, add(n45,n45), add(n45,n45), '-45 → -45 → 동일 좌표'],
      [face, add(n45,face), add(n45,n45), '정면 → -45+정면 → -45×2'],
      [face, add(face,face), add(face,face,face), '정면 → 정면 → 정면'],
      [p45, add(face,p45), add(face,p45), '+45 → 정면+45 → 동일 좌표'],
      [p45, add(p45,p90), add(p45,p45), '+45 → +90 → +45']
    ] : [
      [n90, add(n90,n90), add(n90,n90), '-90 → -90 → 동일 좌표'],
      [n45, add(n45,n45), add(n90,n45), '-45 → -45 → -90+-45'],
      [face, add(n45,face), add(n45,n45,face), '정면 → -45+정면 → -45×2+정면'],
      [face, add(face,face), add(n45,face,face), '정면 → 정면 → -45+정면×2'],
      [face, add(face,face), add(face,face,face), '정면 → 정면 → 정면'],
      [p45, add(face,p45), add(face,face,p45), '+45 → 정면+45 → 정면×2+45'],
      [p45, add(p45,p45), add(p45,p45), '+45 → +45 → 동일 좌표']
    ];
    return { cardinal, points: rows[step - 1].slice(0, 3), label: rows[step - 1][3] };
  }

  function el(name, attrs = {}) {
    const node = document.createElementNS(NS, name);
    Object.entries(attrs).forEach(([k,v]) => node.setAttribute(k, v));
    return node;
  }

  function draw() {
    const face = faceSelect.value.split(',').map(Number);
    const step = Number(stepInput.value);
    const route = routeFor(face, step);
    const points = [[0,0], ...route.points];
    stepLabel.textContent = `${step} / 7`;
    branchLabel.textContent = route.cardinal ? '직선 방향 분기' : '대각선 방향 분기';
    sequenceLabel.textContent = route.label;

    const width = Math.max(320, root.clientWidth || 736);
    const height = width < 480 ? 360 : 430;
    svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
    svg.replaceChildren(svg.querySelector('title') || el('title'), svg.querySelector('desc') || el('desc'));

    const extent = 4;
    const cell = Math.min((width - 70) / (extent * 2 + 1), (height - 60) / (extent * 2 + 1));
    const cx = width / 2;
    const cy = height / 2;
    const sx = x => cx + x * cell;
    const sy = y => cy + y * cell;

    for (let i = -extent; i <= extent; i++) {
      svg.appendChild(el('line', {x1:sx(i), y1:sy(-extent), x2:sx(i), y2:sy(extent), class:i===0?'srs-axis':'srs-grid'}));
      svg.appendChild(el('line', {x1:sx(-extent), y1:sy(i), x2:sx(extent), y2:sy(i), class:i===0?'srs-axis':'srs-grid'}));
    }

    svg.appendChild(el('line', {x1:cx, y1:cy, x2:sx(face[0]*1.45), y2:sy(face[1]*1.45), class:'srs-facing'}));
    const arrow = el('text', {x:sx(face[0]*1.7), y:sy(face[1]*1.7), class:'srs-label'});
    arrow.textContent = 'FACE'; svg.appendChild(arrow);

    const poly = el('polyline', {points:points.map(p => `${sx(p[0])},${sy(p[1])}`).join(' '), class:'srs-path'});
    svg.appendChild(poly);

    const labels = ['P','N','M','F'];
    const classes = ['srs-mark-player','srs-mark-near','srs-mark-middle','srs-mark-far'];
    points.forEach((p, i) => {
      const circle = el('circle', {cx:sx(p[0]), cy:sy(p[1]), r:Math.max(12, cell*.28), class:`srs-ring ${classes[i]}`, stroke:`var(--${i===0?'foreground':`viz-series-${i}`})`});
      svg.appendChild(circle);
      const text = el('text', {x:sx(p[0]), y:sy(p[1]), class:'srs-label'}); text.textContent = labels[i]; svg.appendChild(text);
      const coord = el('text', {x:sx(p[0]), y:sy(p[1]) + Math.max(24, cell*.48), class:'srs-coord'}); coord.textContent = `(${p[0]}, ${p[1]})`; svg.appendChild(coord);
    });
  }

  faceSelect.addEventListener('change', draw);
  stepInput.addEventListener('input', draw);
  new ResizeObserver(draw).observe(root);
  draw();
})();
</script>
